name: Run smoke tests

permissions:
  contents: write

concurrency:
  group: dummytests-allure-publish
  cancel-in-progress: false

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "What suite?"
        required : false
        default: 'testng-smoke.xml'
        type: choice
        options: [testng-smoke.xml, testng-integration.xml, testng-e2e.xml, testng.xml]
  workflow_call:
    inputs:
      suite:
        type: string
        default: 'testng-smoke.xml'
    secrets:
      DUMMYPROJECT_PAT:
        required: true



jobs:
  execute-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout dependencies
        uses: actions/checkout@v4
        with:
          repository: kobrynv481/dummyproject
          token: ${{ secrets.DUMMYPROJECT_PAT }}
          path: dummyproject-src

      - name: Preparation of JDK
        uses: ./.github/actions/setup-java

      - name: Build dependencies
        working-directory: dummyproject-src
        run: mvn install -DskipTests

      - name: Start dummyproject
        working-directory: dummyproject-src
        run: |
          nohup java -jar target/dummyproject-1.0.0-exec.jar > dummyproject.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "dummyproject is up"
              exit 0
            fi
            sleep 1
          done
          echo "dummyproject did not start in time"
          cat dummyproject.log
          exit 1

      - name: Resolve suite
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            SUITE="${{ inputs.suite }}"
          else
            SUITE="testng-smoke.xml"
          fi
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"
          echo "suite_name=${SUITE%.xml}" >> "$GITHUB_OUTPUT"

      - name : Build and execute tests
        run :  mvn test -DsuiteXmlFile=src/test/resources/${{ steps.resolve.outputs.suite }} -Dallure.results.directory=target/allure-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ steps.resolve.outputs.suite_name }}
          path: target/allure-results

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit

      - name: Push results to Allure
        if: always() && github.event_name != 'workflow_call'
        uses: ./.github/actions/to-allure
        with:
          run-label: ${{ github.run_number }}-${{ steps.resolve.outputs.suite_name }}
