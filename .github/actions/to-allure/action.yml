name: Push results to Allure
inputs:
  run-label:
    description: 'Unique label for this report folder (e.g. run number + suite name)'
    required: true
  allure-results-path:
    description: 'Directory containing allure-results to publish'
    required: false
    default: 'target/allure-results'
runs:
  using: composite
  steps:
    - name: Get previous Allure history
      if: always()
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure report (with history)
      if: always()
      uses: simple-elf/allure-report-action@master
      with:
        allure_results: ${{ inputs.allure-results-path }}
        allure_history: allure-history
        keep_reports: 20
        github_run_num: ${{ inputs.run-label }}

    - name: Build reports index page
      if: always()
      shell: bash
      run: |
        cd allure-history
        {
          echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Allure Reports</title></head><body>"
          echo "<h1>Test reports (newest first)</h1><ul>"
          for d in $(ls -dt */ | grep -v last-history); do
            name="${d%/}"
            echo "<li><a href=\"${name}/index.html\">${name}</a></li>"
          done
          echo "</ul></body></html>"
        } > index.html

    - name: Clean up allure-history git metadata
      if: always()
      shell: bash
      run: sudo rm -rf allure-history/.git

    - name: Publish report + history
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ github.token }}
        publish_branch: gh-pages
        publish_dir: allure-history
        force_orphan: true
